<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Add Money</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  font-family:Arial,sans-serif;
  color:#fff;

  background:
    radial-gradient(
      circle at top,
      #123d78 0%,
      transparent 45%
    ),
    linear-gradient(
      135deg,
      #020b1c,
      #071d3d,
      #020b1c
    );
}

.box{
  width:100%;
  max-width:430px;
  padding:26px;

  border-radius:24px;

  background:rgba(255,255,255,.08);

  border:1px solid rgba(255,255,255,.14);

  backdrop-filter:blur(20px);

  box-shadow:
    0 25px 70px rgba(0,0,0,.45);
}

.title{
  text-align:center;
  font-size:28px;
  font-weight:700;
  margin-bottom:22px;
}

.balance{
  padding:22px;

  border-radius:18px;

  background:rgba(0,120,255,.14);

  border:1px solid rgba(90,180,255,.20);

  margin-bottom:22px;
}

.balance small{
  opacity:.65;
}

.balance h2{
  margin-top:7px;
  font-size:34px;
}

label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  opacity:.8;
}

input{
  width:100%;
  height:52px;

  padding:0 15px;

  border-radius:14px;

  border:1px solid rgba(255,255,255,.15);

  outline:none;

  background:rgba(0,0,0,.22);

  color:#fff;

  font-size:17px;
}

input::placeholder{
  color:#aaa;
}

button{
  width:100%;
  height:52px;

  margin-top:15px;

  border:0;
  border-radius:14px;

  background:#1687ff;

  color:#fff;

  font-size:17px;
  font-weight:700;

  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.message{
  min-height:22px;

  margin-top:15px;

  text-align:center;

  font-size:14px;
}

.success{
  color:#54e58b;
}

.error{
  color:#ff7474;
}

.loading{
  opacity:.7;
}

.note{
  margin-top:18px;

  text-align:center;

  font-size:12px;

  opacity:.45;
}
</style>
</head>


<body>

<div class="box">

  <div class="title">
    Add Money
  </div>


  <div class="balance">

    <small>
      Current Balance
    </small>

    <h2>
      ৳ <span id="balance">0.00</span>
    </h2>

  </div>


  <label>
    Amount
  </label>


  <input
    id="amount"
    type="number"
    min="1"
    step="0.01"
    placeholder="Enter amount"
  >


  <button id="addBtn">
    Add Money
  </button>


  <div
    id="message"
    class="message">
  </div>


  <div class="note">
    Secure payment powered by RupantorPay
  </div>

</div>


<script type="module">

/* =========================================
   FIREBASE
   ========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  onValue
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================================
   YOUR TEST FIREBASE CONFIG
   ========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyB_bblG8Nl9BiOO2FyyonG0b8jhnDWCAjU",

  authDomain:
    "testproject-de1bd.firebaseapp.com",

  databaseURL:
    "https://testproject-de1bd-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "testproject-de1bd",

  storageBucket:
    "testproject-de1bd.firebasestorage.app",

  messagingSenderId:
    "100533871658",

  appId:
    "1:100533871658:web:a29546419d094d14098f53",

  measurementId:
    "G-TF6R0J8463"

};


/* ========================================= */

const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const database =
  getDatabase(app);


let currentUser = null;


/* =========================================
   MESSAGE
   ========================================= */

function showMessage(text,type=""){

  const element =
    document.getElementById("message");

  element.className =
    "message " + type;

  element.textContent =
    text;

}


/* =========================================
   FIREBASE ANONYMOUS LOGIN
   ========================================= */

signInAnonymously(auth)
.then(()=>{

  console.log(
    "Firebase anonymous login successful"
  );

})
.catch(error=>{

  console.error(error);

  showMessage(
    "Firebase authentication failed.",
    "error"
  );

});


/* =========================================
   USER AUTH STATE
   ========================================= */

onAuthStateChanged(
  auth,
  async(user)=>{

    if(!user){
      return;
    }


    currentUser =
      user;


    try{

      /*
        Tell server to create user
        if it doesn't exist.
      */

      const token =
        await user.getIdToken();


      await fetch(
        "/api/init-user",
        {

          method:"POST",

          headers:{
            "Authorization":
              "Bearer " + token
          }

        }
      );


      /*
        Listen to real-time balance
      */

      const balanceRef =
        ref(
          database,
          "users/" +
          user.uid +
          "/balance"
        );


      onValue(
        balanceRef,
        (snapshot)=>{

          const value =
            Number(
              snapshot.val() || 0
            );


          document
          .getElementById("balance")
          .textContent =
            value.toFixed(2);

        }
      );


    }catch(error){

      console.error(error);

      showMessage(
        "Unable to load account.",
        "error"
      );

    }

  }
);


/* =========================================
   ADD MONEY BUTTON
   ========================================= */

document
.getElementById("addBtn")
.addEventListener(
  "click",
  async()=>{

    if(!currentUser){

      showMessage(
        "Please wait...",
        "loading"
      );

      return;
    }


    const amount =
      Number(
        document
        .getElementById("amount")
        .value
      );


    if(
      !Number.isFinite(amount) ||
      amount < 1
    ){

      showMessage(
        "Minimum amount is ৳1.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "addBtn"
      );


    button.disabled =
      true;


    button.textContent =
      "Creating Payment...";


    try{

      const token =
        await currentUser.getIdToken();


      const response =
        await fetch(
          "/api/create-payment",
          {

            method:"POST",

            headers:{

              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " + token

            },

            body:
              JSON.stringify({
                amount:amount
              })

          }
        );


      const data =
        await response.json();


      if(
        !response.ok ||
        !data.payment_url
      ){

        throw new Error(
          data.message ||
          "Payment creation failed."
        );

      }


      /*
        Go to RupantorPay
      */

      window.location.href =
        data.payment_url;


    }catch(error){

      console.error(error);


      showMessage(
        error.message,
        "error"
      );


      button.disabled =
        false;


      button.textContent =
        "Add Money";

    }

  }
);


/* =========================================
   PAYMENT RETURN
   ========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const payment =
  params.get("payment");


const orderId =
  params.get("orderId");


const transactionId =
  params.get("transactionId");


/* =========================================
   VERIFY PAYMENT
   ========================================= */

async function verifyPayment(){

  if(payment !== "success"){
    return;
  }


  if(
    !orderId ||
    !transactionId
  ){

    showMessage(
      "Payment information missing.",
      "error"
    );

    return;

  }


  if(!currentUser){

    setTimeout(
      verifyPayment,
      800
    );

    return;

  }


  showMessage(
    "Verifying payment...",
    "loading"
  );


  try{

    const token =
      await currentUser.getIdToken();


    const response =
      await fetch(
        "/api/verify-payment",
        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + token

          },

          body:
            JSON.stringify({

              orderId:
                orderId,

              transactionId:
                transactionId

            })

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Payment verification failed."
      );

    }


    showMessage(
      "Payment successful! Balance added.",
      "success"
    );


    /*
      Remove payment parameters
      from browser URL.
    */

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );


  }catch(error){

    console.error(error);


    showMessage(
      error.message,
      "error"
    );

  }

}


/* =========================================
   CANCEL
   ========================================= */

if(payment === "cancel"){

  showMessage(
    "Payment cancelled.",
    "error"
  );


  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );

}


/* ========================================= */

if(payment === "success"){

  setTimeout(
    verifyPayment,
    800
  );

}

</script>

</body>
</html>
